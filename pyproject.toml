[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrd-typegroups-classifier-printed-handwritten"
version = "0.0.1"
description = "Classify printed and handwritten text lines"
readme = "README"
requires-python = ">=3.9,<3.11"
license = {file = "LICENSE"}
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
ocrd = {file = ["requirements-ocrd.txt"]}

[project.scripts]
ocrd-typegroups-classifier = "ocrd_typegroups_classifier.cli.ocrd_cli:cli"
ocrd-typegroups-classify = "ocrd_typegroups_classifier.cli.classify:main"
ocrd-typegroups-train = "ocrd_typegroups_classifier.cli.train_model:main"
ocrd-typegroups-evaluate = "ocrd_typegroups_classifier.cli.evaluate_model:main"
ocrd-typegroups-simple = "ocrd_typegroups_classifier.cli.simple:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocrd_typegroups_classifier = ["ocrd-tool.json"]
"ocrd_typegroups_classifier.models" = ["*.tgc"]
